openapi: 3.1.0
info:
  title: Autoloker API
  version: 1.0.0
  description: API documentation for mobile authentication, profile editing, security work history CRUD, security certificate CRUD, public job vacancy and training listings, company- and BUJP-owned job vacancy and training management, job vacancy and training applications, paginated vacancy, published training, registered training listings, owned application status follow-up, active subscription plans, and hierarchical location references.
  license:
    name: Proprietary

servers:
  - url: http://localhost
    description: Local development server

paths:
  /api/login:
    post:
      summary: Log in to a mobile account
      description: Authenticates a security, company, or BUJP user with an email or phone number.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              role: security
              identifier: budi@example.com
              password: Secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '422':
          description: Invalid credentials, role mismatch, inactive account, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security: []

  /api/job-vacancies:
    get:
      summary: List published job vacancies
      description: Returns published vacancies that have not expired. The search parameter matches the position, company name, or BUJP name. Each vacancy includes `is_applied`, which is true when the authenticated security user has an application for that vacancy. Results are ordered by newest vacancy ID and paginated with five vacancies per page.
      operationId: listJobVacancies
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Partial search across the vacancy position, company name, and BUJP name.
          schema:
            type: string
            maxLength: 255
            example: security
          example: security
        - name: province_name
          in: query
          required: false
          description: Filter by the exact province name.
          schema:
            type: string
            maxLength: 255
            example: KALIMANTAN TIMUR
          example: KALIMANTAN TIMUR
        - name: working_type
          in: query
          required: false
          description: Filter by employment type.
          schema:
            type: string
            enum: [permanent, contract, intenrship, freelance]
            example: permanent
          example: permanent
        - name: working_system
          in: query
          required: false
          description: Filter by work system.
          schema:
            type: string
            enum: [shift, non-shift]
            example: shift
          example: shift
        - name: certificate
          in: query
          required: false
          description: Filter vacancies requiring this certificate.
          schema:
            type: string
            maxLength: 255
            example: GADA PRATAMA
          example: GADA PRATAMA
        - name: min_price
          in: query
          required: false
          description: Return vacancies whose minimum fee is at least this amount.
          schema:
            type: number
            minimum: 0
            example: 8000000
          example: 8000000
        - name: is_urgent
          in: query
          required: false
          description: Filter urgent vacancies. Send 1 for urgent or 0 for non-urgent.
          schema:
            type: integer
            enum: [0, 1]
            example: 1
          example: 1
        - name: min_experience
          in: query
          required: false
          description: Return vacancies requiring no more than this many years of experience, including vacancies without an experience requirement.
          schema:
            type: integer
            minimum: 0
            example: 2
          example: 2
        - name: gender
          in: query
          required: false
          description: Filter by the vacancy gender requirement. Vacancies without a gender requirement are also included.
          schema:
            type: string
            enum: [laki-laki, perempuan]
            example: laki-laki
          example: laki-laki
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Published job vacancies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobVacancyListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/JobVacancyListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/job-vacancies:
    get:
      summary: List the authenticated company's or BUJP's job vacancies
      description: Returns only job vacancies owned by the authenticated company or BUJP account. Results include every vacancy status, are ordered by newest vacancy ID, and are paginated with five vacancies per page. The optional search parameter matches the position or location fields.
      operationId: listOwnedJobVacancies
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Partial search across the vacancy position and location.
          schema:
            type: string
            maxLength: 255
            example: security
          example: security
        - name: status
          in: query
          required: false
          description: Filter by vacancy status. Omit the parameter or send all to include every status.
          schema:
            type: string
            enum: [all, draft, rejected, submitted, published, closed]
            default: all
            example: published
          example: published
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Owned job vacancies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobVacancyListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create a job vacancy for the authenticated company or BUJP
      description: >-
        Creates a company- or BUJP-owned job vacancy as a draft by default. For save_draft, only
        position is required. Set workflow_action to submit to validate and submit the vacancy directly
        for review; submit requires every field listed in the complete request example. Ownership,
        status, timestamps, provider, and application counters are server-managed. The request uses
        responsibilities and quota; these map to responsibility and kuota in storage and response
        data. The response-only fields start_date, fee_type, gender, district, and village are not
        accepted in this request.
      operationId: createOwnedJobVacancy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnedJobVacancyRequest'
            examples:
              draft:
                summary: Create a complete draft from a real vacancy
                value:
                  position: Satpam Objek Vital (Obvit) - Test 10
                  description_work: Pengamanan pada objek vital seperti pembangkit listrik, pelabuhan, bandara dan kilang minyak.
                  province: KALIMANTAN TIMUR
                  city: KOTA BALIKPAPAN
                  address: Jl. Jend Sudirman
                  working_type: permanent
                  working_system: shift
                  responsibilities:
                    - Pengamanan aset strategis negara maupun swasta nasional
                    - Pengawasan akses keluar masuk area objek vital
                    - Penerapan standar protokol pengamanan yang ketat
                    - Patroli dan pengawasan area strategis
                    - Penanganan kondisi darurat dan potensi ancaman keamanan
                  min_age: 20
                  max_age: 45
                  min_height: 165
                  max_height: 190
                  min_weight: 60
                  max_weight: 80
                  last_education: D3
                  min_experience: 2
                  certificate:
                    - GADA PRATAMA
                    - GADA UTAMA
                  competency_scheme:
                    - Kompetensi Gada Pratama
                    - Kompetensi Gada Utama
                  facility:
                    - Asuransi Kesehatan Premium
                    - Tempat Tinggal
                    - Relokasi Keluarga
                    - Penyesuaian Gaji Tahunan
                  min_price: 8000000
                  max_price: 12000000
                  is_show_fee: true
                  is_urgent: true
                  quota: 2
                  end_date: '2026-12-31'
                  workflow_action: save_draft
              submit:
                summary: Create and submit a complete vacancy
                value:
                  position: Satpam Objek Vital (Obvit) - Test 10
                  description_work: Pengamanan pada objek vital seperti pembangkit listrik, pelabuhan, bandara dan kilang minyak.
                  province: KALIMANTAN TIMUR
                  city: KOTA BALIKPAPAN
                  address: Jl. Jend Sudirman
                  working_type: permanent
                  working_system: shift
                  responsibilities:
                    - Pengamanan aset strategis negara maupun swasta nasional
                    - Pengawasan akses keluar masuk area objek vital
                    - Penerapan standar protokol pengamanan yang ketat
                    - Patroli dan pengawasan area strategis
                    - Penanganan kondisi darurat dan potensi ancaman keamanan
                  min_age: 20
                  max_age: 45
                  min_height: 165
                  max_height: 190
                  min_weight: 60
                  max_weight: 80
                  last_education: D3
                  min_experience: 2
                  certificate:
                    - GADA PRATAMA
                    - GADA UTAMA
                  competency_scheme:
                    - Kompetensi Gada Pratama
                    - Kompetensi Gada Utama
                  facility:
                    - Asuransi Kesehatan Premium
                    - Tempat Tinggal
                    - Relokasi Keluarga
                    - Penyesuaian Gaji Tahunan
                  min_price: 8000000
                  max_price: 12000000
                  is_show_fee: true
                  is_urgent: true
                  quota: 2
                  end_date: '2026-12-31'
                  workflow_action: submit
      responses:
        '201':
          description: Job vacancy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobVacancyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/job-vacancies/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a job vacancy owned by the authenticated company or BUJP.
        schema:
          type: string
          format: uuid
    get:
      summary: Get an owned job vacancy
      description: Returns a job vacancy only when it belongs to the authenticated company or BUJP.
      operationId: getOwnedJobVacancy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned job vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobVacancyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an owned job vacancy
      description: >-
        Partially updates a job vacancy owned by the authenticated company or BUJP. Omitted fields
        remain unchanged and null clears nullable fields. responsibilities, certificate,
        competency_scheme, and facility replace their complete existing arrays. For every
        minimum/maximum pair, the minimum must be less than or equal to the maximum. Province and
        city must identify a valid location pair when supplied. workflow_action, start_date, fee_type,
        gender, ownership, status, timestamps, and application counters are not accepted; submit the
        vacancy separately using the submit endpoint.
      operationId: updateOwnedJobVacancy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnedJobVacancyRequest'
            examples:
              update:
                summary: Update every mutable vacancy field
                value:
                  position: Satpam Objek Vital (Obvit) - Test 10
                  description_work: Pengamanan pada objek vital seperti pembangkit listrik, pelabuhan, bandara dan kilang minyak.
                  province: KALIMANTAN TIMUR
                  city: KOTA BALIKPAPAN
                  address: Jl. Jend Sudirman
                  working_type: permanent
                  working_system: shift
                  responsibilities:
                    - Pengamanan aset strategis negara maupun swasta nasional
                    - Pengawasan akses keluar masuk area objek vital
                    - Penerapan standar protokol pengamanan yang ketat
                    - Patroli dan pengawasan area strategis
                    - Penanganan kondisi darurat dan potensi ancaman keamanan
                  min_age: 20
                  max_age: 45
                  min_height: 165
                  max_height: 190
                  min_weight: 60
                  max_weight: 80
                  last_education: D3
                  min_experience: 2
                  certificate:
                    - GADA PRATAMA
                    - GADA UTAMA
                  competency_scheme:
                    - Kompetensi Gada Pratama
                    - Kompetensi Gada Utama
                  facility:
                    - Asuransi Kesehatan Premium
                    - Tempat Tinggal
                    - Relokasi Keluarga
                    - Penyesuaian Gaji Tahunan
                  min_price: 8000000
                  max_price: 12000000
                  is_show_fee: true
                  is_urgent: true
                  quota: 2
                  end_date: '2026-12-31'
      responses:
        '200':
          description: Job vacancy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobVacancyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/job-vacancies/{uuid}/submit:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a draft or rejected job vacancy owned by the authenticated company or BUJP.
        schema:
          type: string
          format: uuid
    post:
      summary: Submit an owned job vacancy for review
      description: Submits a draft or rejected job vacancy owned by the authenticated company or BUJP for review. The complete vacancy payload is validated before the status changes to `submitted`.
      operationId: submitOwnedJobVacancy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job vacancy submitted for review successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobVacancyResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'


  /api/company/job-vacancies/{uuid}/applicants:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a job vacancy owned by the authenticated company or BUJP.
        schema:
          type: string
          format: uuid
    get:
      summary: List applicants for an owned job vacancy
      description: Returns applicants for the selected job vacancy when it is owned by the authenticated company or BUJP. Results are ordered by newest application first and paginated with five applicants per page. The optional search parameter matches the applicant name, email, phone number, KTP number, or registration number. The status parameter filters the application status.
      operationId: listOwnedJobApplicants
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Partial search across applicant profile contact and identification fields.
          schema:
            type: string
            maxLength: 255
            example: Budi
          example: Budi
        - name: status
          in: query
          required: false
          description: Filter by application status. Omit the parameter or send all to include every status.
          schema:
            type: string
            enum: [all, applied, reviewed, shortlisted, rejected]
            default: all
            example: reviewed
          example: reviewed
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Applicants for the owned job vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedJobApplicantListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/job-vacancies/{uuid}/applicants/{applicationUuid}/status:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a job vacancy owned by the authenticated company or BUJP.
        schema:
          type: string
          format: uuid
      - name: applicationUuid
        in: path
        required: true
        description: UUID of an application belonging to the selected job vacancy.
        schema:
          type: string
          format: uuid
    patch:
      summary: Update an owned job applicant status
      description: Updates the application status for an applicant belonging to a job vacancy owned by the authenticated company or BUJP.
      operationId: updateOwnedJobApplicantStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobApplicantStatusRequest'
      responses:
        '200':
          description: Job applicant status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicantStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/trainings/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a training owned by the authenticated BUJP.
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve an owned training
      description: Returns the complete canonical training resource when it belongs to the authenticated BUJP. Trainings owned by another BUJP are returned as not found.
      operationId: getOwnedTraining
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned training
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedTrainingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Partially update an owned training
      description: >-
        Updates only submitted fields. Omitted fields remain unchanged, null clears nullable fields,
        and tags, syllabus, or requirements replace their complete existing array. The start and end
        dates must use YYYY-MM-DD, and duration_day is recalculated from them. UUID, ownership,
        provider, workflow_action, status, timestamps, counters, and duration_day are immutable.
        For multipart/form-data, arrays may be sent as JSON-encoded array strings.
      operationId: updateOwnedTraining
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnedTrainingRequest'
            examples:
              update:
                summary: Update every mutable training field
                value:
                  title: Pelatihan Gada Pratama Angkatan 12 - Test 10
                  category: Keamanan / Satpam
                  level: Lanjutan
                  is_certificate: true
                  tags:
                    - Satpam
                    - GadaPratama
                    - AutoTalenta
                  description: >-
                    Persiapkan diri menjadi tenaga pengamanan yang disiplin, terampil, dan profesional
                    melalui Pelatihan Gada Pratama Angkatan 12. Program ini membekali peserta dengan
                    pengetahuan dasar pengamanan, etika profesi, dan keterampilan menjaga keamanan.
                  start_date: '2026-09-26'
                  end_date: '2026-09-29'
                  total_jp: 40
                  training_mode: offline
                  province: KALIMANTAN TIMUR
                  city: KOTA BALIKPAPAN
                  address: Jl. Jend Sudirman
                  syllabus:
                    - Dasar Profesi & Etika
                    - Disiplin & Kesiapan Diri
                    - Pengamanan Lingkungan
                    - Komunikasi & Pelaporan
                    - Keselamatan & Keadaan Darurat
                    - Simulasi & Evaluasi
                  requirements:
                    - Formulir Pendaftaran dan Kontak Aktif
                    - Salinan KTP
                    - Surat Keterangan Sehat
                  instructor: AKBP Budi Santoso
                  quota: 30
                  price: 0
                  poster: training/posters/ZMA1dfKYh1TSmNyMGoTPwzqR4tqwzqLsKtPFtnB8.png
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateOwnedTrainingRequest'
            encoding:
              poster:
                contentType: image/jpeg, image/png, image/webp
            examples:
              update:
                summary: Update training fields and upload a poster
                description: Send poster as a JPG, JPEG, PNG, or WEBP file; send array fields as JSON-encoded arrays when required by the multipart client.
                value:
                  title: Pelatihan Gada Pratama Angkatan 12 - Test 10
                  category: Keamanan / Satpam
                  level: Lanjutan
                  is_certificate: true
                  tags:
                    - Satpam
                    - GadaPratama
                    - AutoTalenta
                  description: >-
                    Persiapkan diri menjadi tenaga pengamanan yang disiplin, terampil, dan profesional
                    melalui Pelatihan Gada Pratama Angkatan 12.
                  start_date: '2026-09-26'
                  end_date: '2026-09-29'
                  total_jp: 40
                  training_mode: offline
                  province: KALIMANTAN TIMUR
                  city: KOTA BALIKPAPAN
                  address: Jl. Jend Sudirman
                  syllabus:
                    - Dasar Profesi & Etika
                    - Disiplin & Kesiapan Diri
                    - Pengamanan Lingkungan
                    - Komunikasi & Pelaporan
                    - Keselamatan & Keadaan Darurat
                    - Simulasi & Evaluasi
                  requirements:
                    - Formulir Pendaftaran dan Kontak Aktif
                    - Salinan KTP
                    - Surat Keterangan Sehat
                  instructor: AKBP Budi Santoso
                  quota: 30
                  price: 0
                  poster: poster.png
      responses:
        '200':
          description: Training updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedTrainingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/trainings/{uuid}/submit:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a training owned by the authenticated BUJP.
        schema:
          type: string
          format: uuid
    post:
      summary: Submit an owned training for review
      description: Submits a draft or rejected training after complete validation. Validation failure leaves the draft unchanged.
      operationId: submitOwnedTraining
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Training submitted for review successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedTrainingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/trainings/{uuid}/participants:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a training owned by the authenticated BUJP.
        schema:
          type: string
          format: uuid
    get:
      summary: List participants for an owned training
      description: Returns registrants for the selected training when it is owned by the authenticated BUJP. Companies cannot use this endpoint because only BUJPs can post trainings. Results are ordered by newest registration first and paginated with five participants per page. The optional search parameter matches the participant name, email, phone number, KTP number, or registration number. The status parameter filters the registration status.
      operationId: listOwnedTrainingParticipants
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Partial search across participant profile contact and identification fields.
          schema:
            type: string
            maxLength: 255
            example: Budi
          example: Budi
        - name: status
          in: query
          required: false
          description: Filter by registration status. Omit the parameter or send all to include every status.
          schema:
            type: string
            enum: [all, pending, approved, rejected]
            default: all
            example: pending
          example: pending
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Participants for the owned training
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedTrainingParticipantListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/company/trainings/{uuid}/participants/{applicationUuid}/status:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of a training owned by the authenticated BUJP.
        schema:
          type: string
          format: uuid
      - name: applicationUuid
        in: path
        required: true
        description: UUID of a registration belonging to the selected training.
        schema:
          type: string
          format: uuid
    patch:
      summary: Update an owned training participant status
      description: Updates the registration status for a participant belonging to a training owned by the authenticated BUJP. Approving a participant is rejected when the training quota is full.
      operationId: updateOwnedTrainingParticipantStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingParticipantStatusRequest'
      responses:
        '200':
          description: Training participant status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingParticipantStatusResponse'
        '401':
