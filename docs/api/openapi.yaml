    SecurityProfileState:
      $ref: '#/components/schemas/ProfileState'

    BusinessProfileState:
      $ref: '#/components/schemas/ProfileState'

    ProfileState:
      type: object
      required: [type, id, uuid, profile_completion, is_verified, is_active]
      properties:
        type:
          type: string
          enum: [security, company, bujp]
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        profile_completion:
          $ref: '#/components/schemas/ProfileCompletion'
        is_verified:
          type: [boolean, 'null']
        is_active:
          type: boolean

    ProfileCompletion:
      type: object
      required: [progress, completed, total, missing]
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
        completed:
          type: integer
        total:
          type: integer
        missing:
          type: array
          items:
            type: string

    Capabilities:
      type: object
      required: [profile_complete, profile_verified, can_access_protected_features]
      properties:
        profile_complete:
          type: boolean
        profile_verified:
          type: boolean
        can_access_protected_features:
          type: boolean

    MessageResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string

    RegisterSecurityRequest:
      type: object
      required:
        - role
        - name
        - email
        - phone_number
        - password
        - password_confirmation
        - agree
      properties:
        role:
          type: string
          const: security
          description: Stored as satpam in users.role.
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        phone_number:
          type: string
          minLength: 10
          maxLength: 15
          description: Non-numeric characters are removed; a leading 0 is converted to 62.
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true

    RegisterCompanyRequest:
      type: object
      required:
        - role
        - name
        - email
        - password
        - password_confirmation
        - agree
      properties:
        role:
          type: string
          const: company
        name:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true
        nib:
          type: string
          maxLength: 50
          description: Optional NIB stored on the company profile.

    RegisterBujpRequest:
      type: object
      required:
        - role
        - name
        - email
        - password
        - password_confirmation
        - agree
        - sio_number
        - sio_expired_date
        - sio_file
      properties:
        role:
          type: string
          const: bujp
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true
        nib:
          type: string
          maxLength: 50
          description: Optional NIB stored on the BUJP profile.
        sio_number:
          type: string
          maxLength: 100
        sio_expired_date:
          type: string
          format: date
          description: Must be after today.
        sio_file:
          type: string
          format: binary
          description: PDF, JPG, JPEG, or PNG; maximum 5 MB.

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 50
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$'
      description: Must contain a lowercase letter, uppercase letter, and number.

    RegisterResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Registration successful.
        data:
          $ref: '#/components/schemas/RegisteredUser'

    RegisteredUser:
      type: object
      required:
        - id
        - uuid
        - role
        - name
        - email
      properties:
        id:
          type: integer
          example: 42
        uuid:
          type: string
          format: uuid
        role:
          type: string
          enum: [satpam, company, bujp]
        name:
          type: string
        email:
          type: string
          format: email

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthenticated:
      description: Missing, invalid, expired, or revoked access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not a security account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Security profile or history was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
