        '200':
          description: Published trainings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/TrainingListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/trainings/{uuid}/apply:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the published training.
        schema:
          type: string
          format: uuid
    post:
      summary: Apply for a training
      description: |
        Creates one application for the authenticated security user's profile.
        The training must be published, its start date must not have passed,
        and its approved application count must be below its quota. Repeated
        applications while pending or approved are rejected.
      operationId: applyForTraining
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Training application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingApplicationResponse'
              examples:
                created:
                  $ref: '#/components/examples/TrainingApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The training registration is closed, already submitted, or has reached its approved quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pending:
                  summary: Application is awaiting approval
                  value:
                    status: false
                    message: Your training application is awaiting approval.
                full_quota:
                  summary: Approved quota is full
                  value:
                    status: false
                    message: The training quota is full.

