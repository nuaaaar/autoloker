openapi: 3.1.0
info:
  title: Autoloker API
  version: 1.0.0
  description: API documentation for mobile authentication, profile editing, security work history CRUD, and hierarchical location references.

servers:
  - url: http://localhost
    description: Local development server

paths:
  /api/login:
    post:
      summary: Log in to a mobile account
      description: Authenticates a security, company, or BUJP user with an email or phone number.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              role: security
              identifier: budi@example.com
              password: Secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '422':
          description: Invalid credentials, role mismatch, inactive account, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security: []

  /api/masters/positions:
    get:
      summary: List security positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/abilities:
    get:
      summary: List security abilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active abilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/placements:
    get:
      summary: List security placements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active placements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/industries:
    get:
      summary: List business industries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active industries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/provinces:
    get:
      summary: List provinces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provinces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/cities:
    get:
      summary: List cities for a province
      security:
        - bearerAuth: []
      parameters:
        - name: province_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/districts:
    get:
      summary: List districts for a city
      security:
        - bearerAuth: []
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/villages:
    get:
      summary: List villages for a district
      security:
        - bearerAuth: []
      parameters:
        - name: district_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Villages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/profile:
    get:
      summary: Get the complete authenticated profile
      operationId: getAuthenticatedProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Complete role-specific profile values and state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Partially update the authenticated profile
      operationId: updateAuthenticatedProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/password:
    patch:
      summary: Change or set the authenticated user's local password
      description: |
        Changes the local password for the authenticated user. `current_password`
        is required when `has_local_password` is true and can be omitted when a
        Google-only user is setting a local password for the first time.
      operationId: changeAuthenticatedPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              existing-password:
                summary: Change an existing local password
                value:
                  current_password: OldPass1
                  password: NewPass2
                  password_confirmation: NewPass2
              google-account:
                summary: Set a local password for a Google account
                value:
                  password: NewPass2
                  password_confirmation: NewPass2
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Current password is incorrect or password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/me:
    get:
      summary: Get the authenticated mobile user
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and role-specific profile state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh-token:
    post:
      summary: Refresh mobile access tokens
      description: Exchanges a refresh token for a new access token and rotated refresh token.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/logout:
    post:
      summary: Log out the current mobile session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/register:
    post:
      summary: Register a user
      description: |
        Registers a security, company, or BUJP account using the existing
        users, user_*, and role-specific profile models.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
                - $ref: '#/components/schemas/RegisterBujpRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
              bujp:
                $ref: '#/components/examples/BujpRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                security:
                  $ref: '#/components/examples/SecurityResponse'
                company:
                  $ref: '#/components/examples/CompanyResponse'
                bujp:
                  $ref: '#/components/examples/BujpResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Registration failed because of a server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/security-histories:
    get:
      summary: List the authenticated security user's work histories
      description: Returns only histories belonging to the authenticated satpam user's security profile, ordered newest first.
      operationId: listSecurityHistories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security work histories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/SecurityHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a security work history
      description: Creates a work history for the authenticated security profile. Category must be an active master placement title. `end_date` may be null only when `is_current` is true.
      operationId: createSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '201':
          description: Security history created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                created:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/security-histories/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the security work history.
        schema:
          type: string
          format: uuid
    get:
      summary: Get a security work history
      description: Returns a history only when it belongs to the authenticated security user's profile.
      operationId: getSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                current:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace fields on a security work history. Omitted fields retain their existing values.
      operationId: updateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityHistoryCompletedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Partially update a security work history. Omitted fields retain their existing values.
      operationId: partiallyUpdateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a security work history
      operationId: deleteSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    SecurityHistory:
      type: object
      required: [uuid, position, company_name, location, category, start_date, end_date, description, is_current]
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        position:
          type: [string, 'null']
          description: Security position or job title.
        company_name:
          type: [string, 'null']
        location:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: Master placement title from the active master_placements records.
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
          description: Completion date. Null only when is_current is true.
        description:
          type: [string, 'null']
        is_current:
          type: boolean
          description: True for the current work history. Returned as a JSON boolean.

    SecurityHistoryRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for create and partial updates. Category is submitted as the master placement title. `end_date` may be null only when `is_current` is true; omitted update fields retain their existing values. `is_current` is a JSON boolean.
      properties:
        position: {type: [string, 'null']}
        company_name: {type: [string, 'null']}
        location: {type: [string, 'null']}
        category:
          type: [string, 'null']
          description: Must match an active master_placements.title.
        start_date: {type: [string, 'null'], format: date}
        end_date:
          type: [string, 'null']
          format: date
          description: Completion date. May be null only when is_current is true.
        description: {type: [string, 'null']}
        is_current:
          type: boolean
          description: True when this is the current work history. Responses always return a JSON boolean.

    SecurityHistoryListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        data:
          type: object
          required: [security_histories]
          properties:
            security_histories:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHistory'

    SecurityHistoryResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        message: {type: string}
        data:
          type: object
          required: [security_history]
          properties:
            security_history:
              $ref: '#/components/schemas/SecurityHistory'

    ChangePasswordRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: Required when the authenticated user has a local password.
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
          description: Must match password.

    LoginRequest:
      type: object
      required: [role, identifier, password]
      properties:
        role:
          type: string
          enum: [security, company, bujp]
          description: security maps to the stored satpam role.
        identifier:
          type: string
          maxLength: 150
          description: User email or phone number.
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TokenData'

    AuthenticationResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful.
        data:
          allOf:
            - $ref: '#/components/schemas/TokenData'
            - type: object
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AuthenticatedUser'

    TokenData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          example: 3600

    MeResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          example: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'

    AuthenticatedUser:
      type: object
      required: [id, uuid, role, name, email, status, profile, capabilities, has_local_password]
      properties:
        id: {type: integer}
        uuid: {type: string, format: uuid}
        role:
          type: string
          enum: [satpam, company, bujp]
        name: {type: string}
        email: {type: string, format: email}
        phone_number: {type: [string, 'null']}
        avatar: {type: [string, 'null']}
        status:
          type: string
          enum: [active, non-active]
        email_verified: {type: boolean}
        has_local_password:
          type: boolean
          description: Whether the user has a usable local password. False for Google-only users before first-time password setup.
        profile:
          oneOf:
            - $ref: '#/components/schemas/SecurityProfileState'
            - $ref: '#/components/schemas/BusinessProfileState'
          nullable: true
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    ReferenceListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean}
        data:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}

    LocationListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean}
        data:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: {type: string}
              name: {type: string}
    ProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
        data:
          type: object
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/FullProfile'

    ProfileUpdateResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: boolean
        message:
          type: string
        data:
          type: object
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/FullProfile'

    FullProfile:
      allOf:
        - $ref: '#/components/schemas/ProfileState'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ProfileData'

    ProfileData:
      type: object
      description: Role-specific profile data. Location values are returned as names together with their stable codes.
      additionalProperties: true
      properties:
        province: {type: [string, 'null']}
        province_code: {type: [string, 'null'], description: Province code}
        city: {type: [string, 'null']}
        city_code: {type: [string, 'null'], description: City code}
        district: {type: [string, 'null']}
        district_code: {type: [string, 'null'], description: District code}
        village: {type: [string, 'null']}
        village_code: {type: [string, 'null'], description: Village code}
        ability:
          type: array
          items: {type: string}
        placements:
          type: array
          items: {type: string}

    UpdateSecurityProfileRequest:
      type: object
      description: Partial security profile update. Location fields use master location codes. `additional_notes` is accepted as a legacy alias for `additional_note`.
      additionalProperties: false
      properties:
        name: {type: string, minLength: 3, maxLength: 150}
        email: {type: string, format: email, maxLength: 100}
        phone_number: {type: [string, 'null'], minLength: 10, maxLength: 15}
        birth_place: {type: [string, 'null'], maxLength: 150}
        birth_date: {type: [string, 'null'], format: date}
        gender: {type: [string, 'null'], enum: [laki-laki, perempuan, null]}
        address: {type: [string, 'null']}
        ktp_number: {type: [string, 'null'], maxLength: 50}
        registration_number: {type: [string, 'null'], maxLength: 100}
        work_experience: {type: [string, 'null'], maxLength: 100}
        province: {type: [string, 'null'], description: Province code}
        city: {type: [string, 'null'], description: City code}
        district: {type: [string, 'null'], description: District code}
        village: {type: [string, 'null'], description: Village code}
        width: {type: [string, 'null'], maxLength: 20}
        height: {type: [string, 'null'], maxLength: 20}
        is_out_of_town_agree: {type: [boolean, 'null']}
        is_shift_agree: {type: [boolean, 'null']}
        ability:
          type: [array, 'null']
          items: {type: string, maxLength: 255}
        placements:
          type: [array, 'null']
          items: {type: string, maxLength: 255}
        self_description: {type: [string, 'null']}
        additional_note: {type: [string, 'null'], maxLength: 500}
        additional_notes: {type: [string, 'null'], maxLength: 500, deprecated: true}
        work_status: {type: [string, 'null'], maxLength: 100}
        company_name: {type: [string, 'null'], maxLength: 255}
        position: {type: [string, 'null'], maxLength: 150}
