    SecurityCertificate:
      type: object
      required: [uuid, title, publisher, certificate_number, category, publish_date, expired_date, file, is_badge]
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        certificate_number:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: Active master_category_certificates.title.
        publish_date:
          type: [string, 'null']
          format: date
        expired_date:
          type: [string, 'null']
          format: date
          description: Must be on or after publish_date.
        file:
          type: [string, 'null']
          description: Relative public storage path, for example certificate/example.pdf.
        is_badge:
          type: integer
          enum: [0, 1]
          description: Setting this to 1 marks this as the security's badge and automatically releases any existing badge for the same security.

    CreateSecurityCertificateRequest:
      type: object
      required: [title, publisher, certificate_number, category, publish_date, expired_date]
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        publisher:
          type: [string, 'null']
          maxLength: 255
        certificate_number:
          type: [string, 'null']
          maxLength: 255
        category:
          type: [string, 'null']
          maxLength: 255
          description: Must match an active master_category_certificates.title.
        publish_date:
          type: [string, 'null']
          format: date
        expired_date:
          type: [string, 'null']
          format: date
          description: Must be on or after publish_date.
        file:
          type: string
          format: binary
          description: Optional PDF, JPG, JPEG, or PNG file. Maximum size 10 MB.
        is_badge:
          type: integer
          enum: [0, 1]
          description: Set to 1 to replace the security's current badge; set to 0 to release this certificate as the badge.

    UpdateSecurityCertificateRequest:
      type: object
      additionalProperties: false
      description: All fields are optional. Omitted fields retain their existing values. Category must match an active master_category_certificates.title.
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        publisher:
          type: [string, 'null']
          maxLength: 255
        certificate_number:
          type: [string, 'null']
          maxLength: 255
        category:
          type: [string, 'null']
          maxLength: 255
          description: Must match an active master_category_certificates.title.
        publish_date:
          type: [string, 'null']
          format: date
        expired_date:
          type: [string, 'null']
          format: date
          description: Must be on or after publish_date.
        file:
          type: string
          format: binary
          description: Optional replacement PDF, JPG, JPEG, or PNG file. Maximum size 10 MB.
        is_badge:
          type: integer
          enum: [0, 1]
          description: Set to 1 to replace the security's current badge; set to 0 to release this certificate as the badge.

    SecurityCertificateListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        data:
          type: object
          required: [security_certificates]
          properties:
            security_certificates:
              type: array
              items:
                $ref: '#/components/schemas/SecurityCertificate'

    SecurityCertificateResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        message:
          type: string
        data:
          type: object
          required: [security_certificate]
          properties:
            security_certificate:
              $ref: '#/components/schemas/SecurityCertificate'

    SecurityHistory:
      type: object
      required: [uuid, position, company_name, location, category, start_date, end_date, description, is_current]
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        position:
          type: [string, 'null']
          description: Security position or job title.
        company_name:
          type: [string, 'null']
        location:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: Master placement title from the active master_placements records.
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
          description: Completion date. Null only when is_current is true.
        description:
          type: [string, 'null']
        is_current:
          type: boolean
          description: True for the current work history. Returned as a JSON boolean.

    SecurityHistoryRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for create and partial updates. Category is submitted as the master placement title. `end_date` may be null only when `is_current` is true; omitted update fields retain their existing values. `is_current` is a JSON boolean.
      properties:
        position: {type: [string, 'null']}
        company_name: {type: [string, 'null']}
        location: {type: [string, 'null']}
        category:
          type: [string, 'null']
          description: Must match an active master_placements.title.
        start_date: {type: [string, 'null'], format: date}
        end_date:
          type: [string, 'null']
          format: date
          description: Completion date. May be null only when is_current is true.
        description: {type: [string, 'null']}
        is_current:
          type: boolean
          description: True when this is the current work history. Responses always return a JSON boolean.

    SecurityHistoryListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        data:
          type: object
          required: [security_histories]
          properties:
            security_histories:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHistory'

    SecurityHistoryResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        message: {type: string}
        data:
          type: object
          required: [security_history]
          properties:
            security_history:
              $ref: '#/components/schemas/SecurityHistory'

    ChangePasswordRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: Required when the authenticated user has a local password.
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
          description: Must match password.

    LoginRequest:
      type: object
      required: [role, identifier, password]
      properties:
        role:
          type: string
          enum: [security, company, bujp]
          description: security maps to the stored satpam role.
        identifier:
          type: string
          maxLength: 150
          description: User email or phone number.
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [status, data]
      properties:
