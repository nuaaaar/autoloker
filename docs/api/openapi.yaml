        Google-only user is setting a local password for the first time.
      operationId: changeAuthenticatedPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              existing-password:
                summary: Change an existing local password
                value:
                  current_password: OldPass1
                  password: NewPass2
                  password_confirmation: NewPass2
              google-account:
                summary: Set a local password for a Google account
                value:
                  password: NewPass2
                  password_confirmation: NewPass2
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Current password is incorrect or password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/me:
    get:
      summary: Get the authenticated mobile user
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and role-specific profile state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user-subscriptions/active:
    get:
      summary: Get the authenticated user's active subscription or default plan
      description: >-
        Returns the authenticated user's active subscription for the user's mapped role. When no
        active subscription exists, returns the active price-zero default plan for that same role.
        The response returns `user_subscription: null` only when the role is unsupported or no matching
        active default plan is configured.
      operationId: getActiveUserSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active user subscription or same-role default free plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveUserSubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/user-order-manuals:
    get:
      summary: List the authenticated user's manual subscription orders
      description: Returns the authenticated user's manual subscription order history, newest first, with five orders per page.
      operationId: listUserOrderManuals
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Manual subscription order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrderManualListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create a manual subscription order
      description: Creates a pending manual subscription order for the authenticated user's role. Sending the same plan while a pending payment order already exists returns that existing order instead of creating a duplicate.
      operationId: createUserOrderManual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserOrderManualStoreRequest'
            example:
              subscription_uuid: 8b1f4f8a-5d6f-4a4d-a43d-5f3c9f8c2a11
      responses:
        '201':
          description: Manual subscription order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrderManualResponse'
        '200':
          description: Existing pending order returned for the selected plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrderManualResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'


  /api/refresh-token:
    post:
      summary: Refresh mobile access tokens
      description: Exchanges a refresh token for a new access token and rotated refresh token.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/logout:
    post:
      summary: Log out the current mobile session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
