components:
  schemas:
    Training:
      type: object
      required:
        - id
        - uuid
        - b_u_j_p_id
        - company_id
        - title
        - provider
        - instructor
        - category
        - level
        - price
        - is_free
        - description
        - quota
        - registered
        - tags
        - training_mode
        - province
        - city
        - district
        - village
        - address
        - google_map
        - meeting_url
        - start_date
        - end_date
        - duration_day
        - total_jp
        - is_certificate
        - certificate_name
        - certificate_validity
        - syllabus
        - requirements
        - status
        - reason_rejected
        - total_clicked
        - poster
        - created_at
        - updated_at
        - bujp
        - company
      properties:
        id:
          type: integer
          example: 12
        uuid:
          type: [string, 'null']
          format: uuid
          example: 3f6f6e2c-55ec-4da5-9e35-5d0d33b7f4b0
        b_u_j_p_id:
          type: [integer, 'null']
          example: 3
        company_id:
          type: [integer, 'null']
          example: null
        title:
          type: [string, 'null']
          example: Security Awareness Training
        provider:
          type: [string, 'null']
          example: PT Example Training
        instructor:
          type: [string, 'null']
          example: Budi Santoso
        category:
          type: [string, 'null']
          example: Security
        level:
          type: [string, 'null']
          example: Basic
        price:
          type: [string, 'null']
          example: '750000'
        is_free:
          type: [string, 'null']
          example: '0'
        description:
          type: [string, 'null']
          example: Pelatihan dasar untuk meningkatkan kompetensi petugas keamanan.
        quota:
          type: [string, 'null']
          example: '20'
        registered:
          type: [string, 'null']
          example: '10'
        tags:
          type: array
          items:
            type: string
          example:
            - security
            - awareness
        training_mode:
          type: [string, 'null']
          example: offline
        province:
          type: [string, 'null']
          example: JAWA BARAT
        city:
          type: [string, 'null']
          example: KOTA BANDUNG
        district:
          type: [string, 'null']
          example: Coblong
        village:
          type: [string, 'null']
          example: Dago
        address:
          type: [string, 'null']
          example: Jl. Ir. H. Djuanda No. 10
        google_map:
          type: [string, 'null']
          format: uri
          example: 'https://maps.example.com/?q=training'
        meeting_url:
          type: [string, 'null']
          format: uri
          example: 'https://meeting.example.com/security-training'
        start_date:
          type: [string, 'null']
          format: date
          example: '2026-10-01'
        end_date:
          type: [string, 'null']
          format: date
          example: '2026-10-03'
        duration_day:
          type: [string, 'null']
          example: '3'
        total_jp:
          type: [string, 'null']
          example: '24'
        is_certificate:
          type: integer
          enum: [0, 1]
          example: 1
        certificate_name:
          type: [string, 'null']
          example: Sertifikat Kompetensi Security
        certificate_validity:
          type: [string, 'null']
          example: '2 tahun'
        syllabus:
          type: array
          items:
            type: string
          example:
            - Dasar-dasar pengamanan
            - Penanganan keadaan darurat
        requirements:
          type: array
          items:
            type: string
          example:
            - Kartu identitas
            - Surat keterangan sehat
        status:
          type: string
          enum: [draft, rejected, submitted, published, closed, running, cancelled]
          example: published
        reason_rejected:
          type: [string, 'null']
          example: null
        total_clicked:
          type: [string, 'null']
          example: null
        poster:
          type: [string, 'null']
          example: trainings/security-awareness.jpg
        created_at:
          type: [string, 'null']
          format: date-time
          example: '2026-09-22T04:36:36.000000Z'
        updated_at:
          type: [string, 'null']
          format: date-time
          example: '2026-09-22T08:30:11.000000Z'
        is_applied:
          type: boolean
          description: Whether the authenticated security user has applied for this training.
          example: false
        bujp:
          oneOf:
            - $ref: '#/components/schemas/TrainingOrganization'
            - type: 'null'
        company:
          oneOf:
            - $ref: '#/components/schemas/TrainingOrganization'
            - type: 'null'

    TrainingOrganization:
      type: object
      required: [id, company_name]
      properties:
        id:
          type: integer
          example: 3
        company_name:
          type: [string, 'null']
          example: PT Example Training

    TrainingPagination:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
        - from
        - to

        - has_more
        - next_page_url
        - previous_page_url
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 5
        total:
          type: integer
          example: 1
        from:
          type: [integer, 'null']
          example: 1
        to:
          type: [integer, 'null']
          example: 1
        has_more:
          type: boolean
          example: false
        next_page_url:
          type: [string, 'null']
          format: uri
          example: null
        previous_page_url:
          type: [string, 'null']
          format: uri
          example: null

    TrainingListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          example: true
        data:
          type: object
          required: [trainings, pagination]
          properties:
            trainings:
