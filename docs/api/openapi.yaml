        Accepted request fields for a company- or BUJP-owned vacancy. Drafts require position; using
        workflow_action submit additionally requires description_work, province, city, address,
        working_type, working_system, at least one responsibility, all age/height/weight ranges,
        last_education, min_experience, at least one certificate, competency scheme, facility,
        min_price, max_price, is_show_fee, is_urgent, quota, and end_date. Do not send ownership,
        status, provider, counters, start_date, fee_type, or other response-only fields.
      properties:
        position:
          type: string
          minLength: 3
          maxLength: 150
          description: Vacancy position title.
          example: Satpam Objek Vital (Obvit) - Test 10
        description_work:
          type: [string, 'null']
          description: Work description. Required when workflow_action is submit.
          example: Pengamanan pada objek vital seperti pembangkit listrik, pelabuhan, bandara dan kilang minyak.
        province:
          type: [string, 'null']
          maxLength: 255
          description: Province name. Required with city when workflow_action is submit.
          example: KALIMANTAN TIMUR
        city:
          type: [string, 'null']
          maxLength: 255
          description: City name in the selected province. Required when workflow_action is submit.
          example: KOTA BALIKPAPAN
        address:
          type: [string, 'null']
          description: Work location address. Required when workflow_action is submit.
          example: Jl. Jend Sudirman
        working_type:
          type: string
          description: Employment type.
          enum: [permanent, contract, intenrship, freelance]
          example: permanent
        working_system:
          type: string
          description: Work schedule.
          enum: [shift, non-shift]
          example: shift
        responsibilities:
          type: [array, 'null']
          description: Responsibilities. At least one item is required when workflow_action is submit.
          items:
            type: string
            maxLength: 255
          example:
            - Pengamanan aset strategis negara maupun swasta nasional
            - Pengawasan akses keluar masuk area objek vital
            - Penerapan standar protokol pengamanan yang ketat
            - Patroli dan pengawasan area strategis
            - Penanganan kondisi darurat dan potensi ancaman keamanan
        min_age:
          type: [integer, 'null']
          minimum: 18
          maximum: 100
          description: Minimum applicant age.
          example: 20
        max_age:
          type: [integer, 'null']
          minimum: 18
          maximum: 100
          description: Maximum applicant age; must be greater than or equal to min_age.
          example: 45
        min_height:
          type: [number, 'null']
          minimum: 0
          description: Minimum applicant height.
          example: 165
        max_height:
          type: [number, 'null']
          minimum: 0
          description: Maximum applicant height; must be greater than or equal to min_height.
          example: 190
        min_weight:
          type: [number, 'null']
          minimum: 0
          description: Minimum applicant weight.
          example: 60
        max_weight:
          type: [number, 'null']
          minimum: 0
          description: Maximum applicant weight; must be greater than or equal to min_weight.
          example: 80
        last_education:
          type: [string, 'null']
          description: Minimum education level.
          example: D3
        min_experience:
          type: [integer, 'null']
          minimum: 0
          description: Minimum experience in years.
          example: 2
        certificate:
          type: [array, 'null']
          description: Required certificates. At least one item is required when workflow_action is submit.
          items:
            type: string
            maxLength: 255
          example: [GADA PRATAMA, GADA UTAMA]
        competency_scheme:
          type: [array, 'null']
          description: Required competency schemes. At least one item is required when workflow_action is submit.
          items:
            type: string
            maxLength: 255
          example: [Kompetensi Gada Pratama, Kompetensi Gada Utama]
        facility:
          type: [array, 'null']
          description: Benefits or facilities. At least one item is required when workflow_action is submit.
          items:
            type: string
            maxLength: 255
          example: [Asuransi Kesehatan Premium, Tempat Tinggal, Relokasi Keluarga, Penyesuaian Gaji Tahunan]
        min_price:
          type: [number, 'null']
          minimum: 0
          description: Minimum salary or fee.
          example: 8000000
        max_price:
          type: [number, 'null']
          minimum: 0
          description: Maximum salary or fee; must be greater than or equal to min_price.
          example: 12000000
        is_show_fee:
          type: boolean
          description: Whether the salary or fee is shown to applicants.
          example: true
        is_urgent:
          type: boolean
          description: Whether the vacancy is urgent.
          example: true
        quota:
          type: [integer, 'null']
          minimum: 1
          description: Maximum number of applicants. Required when workflow_action is submit.
          example: 2
        end_date:
          type: [string, 'null']
          format: date
          description: Vacancy closing date in YYYY-MM-DD format. Required when workflow_action is submit.
          example: '2026-12-31'
        workflow_action:
          type: string
          description: Save as draft by default, or validate and submit immediately.
          enum: [save_draft, submit]
          default: save_draft
          example: save_draft

