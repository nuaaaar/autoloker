    CreateOwnedTrainingRequest:
      type: object
      description: >-
        Accepted request fields for a BUJP-owned training. Drafts require title; using
        workflow_action submit additionally requires category, level, description, start_date,
        end_date, total_jp, training_mode, province, city, address, at least one syllabus item,
        at least one requirement, and quota. Do not send provider or ownership fields.
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Training title.
          example: Pelatihan Gada Pratama Angkatan 12 - Test 10
        category:
          type: [string, 'null']
          maxLength: 255
          description: Training category. Required when workflow_action is submit.
          example: Keamanan / Satpam
        level:
          type: [string, 'null']
          maxLength: 255
          description: Training level. Required when workflow_action is submit.
          example: Lanjutan
        is_certificate:
          type: boolean
          description: Whether the training provides a certificate.
          example: true
        tags:
          type: [array, 'null']
          description: Tags for the training. Tag values must be unique, case-insensitively.
          items:
            type: string
            minLength: 1
            maxLength: 255
          example: [Satpam, GadaPratama, AutoTalenta]
        description:
          type: [string, 'null']
          description: Training description. Required when workflow_action is submit.
          example: Pelatihan untuk membekali calon anggota satpam dengan pengetahuan dasar pengamanan.
        start_date:
          type: [string, 'null']
          format: date
          description: Training start date in YYYY-MM-DD format. Required when workflow_action is submit.
          example: '2026-09-26'
        end_date:
          type: [string, 'null']
          format: date
          description: Training end date in YYYY-MM-DD format; must be on or after start_date.
          example: '2026-09-29'
        total_jp:
          type: [integer, 'null']
          minimum: 1
          description: Total learning hours. Required when workflow_action is submit.
          example: 40
        training_mode:
          type: [string, 'null']
          enum: [online, offline, hybrid, null]
          description: Delivery mode. Required when workflow_action is submit.
          example: offline
        province:
          type: [string, 'null']
          maxLength: 255
          description: Province name. Must be provided together with a valid city when workflow_action is submit.
          example: KALIMANTAN TIMUR
        city:
          type: [string, 'null']
          maxLength: 255
          description: City name in the selected province. Required when workflow_action is submit.
          example: KOTA BALIKPAPAN
        address:
          type: [string, 'null']
          description: Training address. Required when workflow_action is submit.
          example: Jl. Jend Sudirman
        syllabus:
          type: [array, 'null']
          description: Ordered syllabus items; at least one item is required when workflow_action is submit.
          items:
            type: string
            minLength: 1
            maxLength: 255
          example:
            - Dasar Profesi & Etika
            - Disiplin & Kesiapan Diri
            - Pengamanan Lingkungan
        requirements:
          type: [array, 'null']
          description: Participant requirements; at least one item is required when workflow_action is submit.
          items:
            type: string
            minLength: 1
            maxLength: 255
          example:
            - Formulir Pendaftaran dan Kontak Aktif
            - Salinan KTP
            - Surat Keterangan Sehat
        instructor:
          type: [string, 'null']
          maxLength: 255
          description: Instructor name.
          example: AKBP Budi Santoso
        quota:
          type: [integer, 'null']
          minimum: 1
          description: Maximum number of approved participants. Required when workflow_action is submit.
          example: 30
        price:
          type: [integer, 'null']
          minimum: 0
          description: Training price; use 0 for a free training.
          example: 0
        poster:
          anyOf:
            - type: string
              maxLength: 2048
              description: Public storage key/path for JSON requests; internal filesystem paths are rejected.
              example: training/posters/ZMA1dfKYh1TSmNyMGoTPwzqR4tqwzqLsKtPFtnB8.png
            - type: string
              format: binary
              description: JPG, JPEG, PNG, or WEBP image file for multipart/form-data, up to 5 MB.
            - type: 'null'
        workflow_action:
          type: string
          description: Save as draft by default, or validate and submit immediately.
          enum: [save_draft, submit]
          default: save_draft
          example: save_draft

