openapi: 3.1.0
info:
  title: Autoloker API
  version: 1.0.0
  description: API documentation for mobile authentication and user registration.

servers:
  - url: http://localhost
    description: Local development server

paths:
  /api/login:
    post:
      summary: Log in to a mobile account
      description: Authenticates a security, company, or BUJP user with an email or phone number.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              role: security
              identifier: budi@example.com
              password: Secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '422':
          description: Invalid credentials, role mismatch, inactive account, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security: []

  /api/masters/positions:
    get:
      summary: List security positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/abilities:
    get:
      summary: List security abilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active abilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/placements:
    get:
      summary: List security placements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active placements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/industries:
    get:
      summary: List business industries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active industries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/provinces:
    get:
      summary: List provinces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provinces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/cities:
    get:
      summary: List cities for a province
      security:
        - bearerAuth: []
      parameters:
        - name: province_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/districts:
    get:
      summary: List districts for a city
      security:
        - bearerAuth: []
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/villages:
    get:
      summary: List villages for a district
      security:
        - bearerAuth: []
      parameters:
        - name: district_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Villages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/profile:
    get:
      summary: Get the complete authenticated profile
      operationId: getAuthenticatedProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Complete role-specific profile values and state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Partially update the authenticated profile
      operationId: updateAuthenticatedProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/me:
    get:
      summary: Get the authenticated mobile user
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and role-specific profile state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh-token:
    post:
      summary: Refresh mobile access tokens
      description: Exchanges a refresh token for a new access token and rotated refresh token.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/logout:
    post:
      summary: Log out the current mobile session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/register:
    post:
      summary: Register a user
      description: |
        Registers a security, company, or BUJP account using the existing
        users, user_*, and role-specific profile models.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
                - $ref: '#/components/schemas/RegisterBujpRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
              bujp:
                $ref: '#/components/examples/BujpRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                security:
                  $ref: '#/components/examples/SecurityResponse'
                company:
                  $ref: '#/components/examples/CompanyResponse'
                bujp:
                  $ref: '#/components/examples/BujpResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Registration failed because of a server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/security-histories:
    get:
      summary: List the authenticated security user's work histories
      description: Returns only histories belonging to the authenticated satpam user's security profile, ordered newest first.
      operationId: listSecurityHistories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security work histories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a security work history
      description: Creates a work history for the authenticated security profile. Category must be an active master placement title.
      operationId: createSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            example:
              position: Security Officer
              company_name: PT Aman Sentosa
              location: Balikpapan
              category: Perkantoran
              start_date: '2022-01-01'
              end_date: '2025-01-31'
              description: Menjaga keamanan area perkantoran dan melakukan patroli.
              is_current: false
      responses:
        '201':
          description: Security history created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/security-histories/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the security work history.
        schema:
          type: string
          format: uuid
    get:
      summary: Get a security work history
      description: Returns a history only when it belongs to the authenticated security user's profile.
      operationId: getSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace fields on a security work history
      operationId: updateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Partially update a security work history
      operationId: partiallyUpdateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a security work history
      operationId: deleteSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    SecurityHistory:
      type: object
      required: [uuid, position, company_name, location, category, start_date, end_date, description, is_current]
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        position:
          type: [string, 'null']
          description: Security position or job title.
        company_name:
          type: [string, 'null']
        location:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: Master placement title from the active master_placements records.
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
        is_current:
          type: boolean

    SecurityHistoryRequest:
      type: object
      additionalProperties: false
      description: All fields are optional for partial updates. Category is submitted as the master placement title.
      properties:
        position: {type: [string, 'null']}
        company_name: {type: [string, 'null']}
        location: {type: [string, 'null']}
        category:
          type: [string, 'null']
          description: Must match an active master_placements.title.
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        description: {type: [string, 'null']}
        is_current: {type: boolean}

    SecurityHistoryListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        data:
          type: object
          required: [security_histories]
          properties:
            security_histories:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHistory'

    SecurityHistoryResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean, example: true}
        message: {type: string}
        data:
          type: object
          required: [security_history]
          properties:
            security_history:
              $ref: '#/components/schemas/SecurityHistory'

    LoginRequest:
      type: object
      required: [role, identifier, password]
      properties:
        role:
          type: string
          enum: [security, company, bujp]
          description: security maps to the stored satpam role.
        identifier:
          type: string
          maxLength: 150
          description: User email or phone number.
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TokenData'

    AuthenticationResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful.
        data:
          allOf:
            - $ref: '#/components/schemas/TokenData'
            - type: object
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AuthenticatedUser'

    TokenData:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          example: 3600

    MeResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
          example: true
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthenticatedUser'

    AuthenticatedUser:
      type: object
      required: [id, uuid, role, name, email, status, profile, capabilities]
      properties:
        id: {type: integer}
        uuid: {type: string, format: uuid}
        role:
          type: string
          enum: [satpam, company, bujp]
        name: {type: string}
        email: {type: string, format: email}
        phone_number: {type: [string, 'null']}
        avatar: {type: [string, 'null']}
        status:
          type: string
          enum: [active, non-active]
        email_verified: {type: boolean}
        profile:
          oneOf:
            - $ref: '#/components/schemas/SecurityProfileState'
            - $ref: '#/components/schemas/BusinessProfileState'
          nullable: true
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    ReferenceListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean}
        data:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}

    LocationListResponse:
      type: object
      required: [status, data]
      properties:
        status: {type: boolean}
        data:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: {type: string}
              name: {type: string}
    ProfileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: boolean
        data:
          type: object
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/FullProfile'

    ProfileUpdateResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: boolean
        message:
          type: string
        data:
          type: object
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/FullProfile'

    FullProfile:
      allOf:
        - $ref: '#/components/schemas/ProfileState'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: true

    UpdateSecurityProfileRequest:
      type: object
      description: Partial security profile fields. All properties are optional.
      additionalProperties: true

    UpdateCompanyProfileRequest:
      type: object
      description: Partial company profile fields. All properties are optional.
      additionalProperties: true

    UpdateBujpProfileRequest:
      type: object
      description: Partial BUJP profile fields. All properties are optional.
      additionalProperties: true

    SecurityProfileState:
      $ref: '#/components/schemas/ProfileState'

    BusinessProfileState:
      $ref: '#/components/schemas/ProfileState'

    ProfileState:
      type: object
      required: [type, id, uuid, profile_completion, is_verified, is_active]
      properties:
        type:
          type: string
          enum: [security, company, bujp]
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        profile_completion:
          $ref: '#/components/schemas/ProfileCompletion'
        is_verified:
          type: [boolean, 'null']
        is_active:
          type: boolean

    ProfileCompletion:
      type: object
      required: [progress, completed, total, missing]
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
        completed:
          type: integer
        total:
          type: integer
        missing:
          type: array
          items:
            type: string

    Capabilities:
      type: object
      required: [profile_complete, profile_verified, can_access_protected_features]
      properties:
        profile_complete:
          type: boolean
        profile_verified:
          type: boolean
        can_access_protected_features:
          type: boolean

    MessageResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string

    RegisterSecurityRequest:
      type: object
      required:
        - role
        - name
        - email
        - phone_number
        - password
        - password_confirmation
        - agree
      properties:
        role:
          type: string
          const: security
          description: Stored as satpam in users.role.
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        phone_number:
          type: string
          minLength: 10
          maxLength: 15
          description: Non-numeric characters are removed; a leading 0 is converted to 62.
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true

    RegisterCompanyRequest:
      type: object
      required:
        - role
        - name
        - email
        - password
        - password_confirmation
        - agree
      properties:
        role:
          type: string
          const: company
        name:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true
        nib:
          type: string
          maxLength: 50
          description: Optional NIB stored on the company profile.

    RegisterBujpRequest:
      type: object
      required:
        - role
        - name
        - email
        - password
        - password_confirmation
        - agree
        - sio_number
        - sio_expired_date
        - sio_file
      properties:
        role:
          type: string
          const: bujp
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        password_confirmation:
          type: string
          format: password
        agree:
          type: boolean
          const: true
        nib:
          type: string
          maxLength: 50
          description: Optional NIB stored on the BUJP profile.
        sio_number:
          type: string
          maxLength: 100
        sio_expired_date:
          type: string
          format: date
          description: Must be after today.
        sio_file:
          type: string
          format: binary
          description: PDF, JPG, JPEG, or PNG; maximum 5 MB.

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 50
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$'
      description: Must contain a lowercase letter, uppercase letter, and number.

    RegisterResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Registration successful.
        data:
          $ref: '#/components/schemas/RegisteredUser'

    RegisteredUser:
      type: object
      required:
        - id
        - uuid
        - role
        - name
        - email
      properties:
        id:
          type: integer
          example: 42
        uuid:
          type: string
          format: uuid
        role:
          type: string
          enum: [satpam, company, bujp]
        name:
          type: string
        email:
          type: string
          format: email

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthenticated:
      description: Missing, invalid, expired, or revoked access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not a security account.
