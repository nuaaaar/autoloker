openapi: 3.1.0
info:
  title: Autoloker API
  version: 1.0.0
  description: API documentation for mobile authentication, profile editing, security work history CRUD, security certificate CRUD, job vacancy applications, paginated vacancy and training listings, and hierarchical location references.

servers:
  - url: http://localhost
    description: Local development server

paths:
  /api/login:
    post:
      summary: Log in to a mobile account
      description: Authenticates a security, company, or BUJP user with an email or phone number.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              role: security
              identifier: budi@example.com
              password: Secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '422':
          description: Invalid credentials, role mismatch, inactive account, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security: []

  /api/job-vacancies:
    get:
      summary: List published job vacancies
      description: Returns published vacancies that have not expired. Results are ordered by newest vacancy ID and paginated with five vacancies per page.
      operationId: listJobVacancies
      security:
        - bearerAuth: []
      parameters:
        - name: province_name
          in: query
          required: false
          description: Filter by the exact province name.
          schema:
            type: string
            maxLength: 255
            example: KALIMANTAN TIMUR
          example: KALIMANTAN TIMUR
        - name: working_type
          in: query
          required: false
          description: Filter by employment type.
          schema:
            type: string
            enum: [permanent, contract, intenrship, freelance]
            example: permanent
          example: permanent
        - name: working_system
          in: query
          required: false
          description: Filter by work system.
          schema:
            type: string
            enum: [shift, non-shift]
            example: shift
          example: shift
        - name: certificate
          in: query
          required: false
          description: Filter vacancies requiring this certificate.
          schema:
            type: string
            maxLength: 255
            example: GADA PRATAMA
          example: GADA PRATAMA
        - name: min_price
          in: query
          required: false
          description: Return vacancies whose minimum fee is at least this amount.
          schema:
            type: number
            minimum: 0
            example: 8000000
          example: 8000000
        - name: is_urgent
          in: query
          required: false
          description: Filter urgent vacancies. Send 1 for urgent or 0 for non-urgent.
          schema:
            type: integer
            enum: [0, 1]
            example: 1
          example: 1
        - name: min_experience
          in: query
          required: false
          description: Return vacancies requiring no more than this many years of experience, including vacancies without an experience requirement.
          schema:
            type: integer
            minimum: 0
            example: 2
          example: 2
        - name: gender
          in: query
          required: false
          description: Filter by the vacancy gender requirement. Vacancies without a gender requirement are also included.
          schema:
            type: string
            enum: [laki-laki, perempuan]
            example: laki-laki
          example: laki-laki
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Published job vacancies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobVacancyListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/JobVacancyListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/trainings:
    get:
      summary: List published trainings for security users
      description: Returns published trainings for authenticated security users, ordered by newest training ID and paginated with five trainings per page. The search parameter matches the title or provider.
      operationId: listTrainings
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Partial search across the training title and provider.
          schema:
            type: string
            maxLength: 255
            example: security
          example: security
        - name: title
          in: query
          required: false
          description: Filter by a partial training title.
          schema:
            type: string
            maxLength: 255
            example: security awareness
          example: security awareness
        - name: provider
          in: query
          required: false
          description: Filter by a partial provider name.
          schema:
            type: string
            maxLength: 255
            example: PT Example Training
          example: PT Example Training
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Published trainings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/TrainingListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/job-vacancies/{uuid}/apply:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the published job vacancy.
        schema:
          type: string
          format: uuid
    post:
      summary: Apply for a job vacancy
      description: |
        Creates one application for the authenticated security user's profile.
        The vacancy must be published, its application deadline must not have
        passed, and its applicant quota must not be full. Repeated applications
        for the same vacancy are rejected.
      operationId: applyForJobVacancy
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Job application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationResponse'
              examples:
                created:
                  $ref: '#/components/examples/JobApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The vacancy is expired, already applied for, or has reached its quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  summary: Duplicate application
                  value:
                    status: false
                    message: You have already applied for this job vacancy.

  /api/job-applications:
    get:
      summary: List the authenticated security user's applications
      description: Returns job vacancies applied for by the authenticated security user, ordered by newest application first and paginated with five vacancies per page.
      operationId: listMyJobApplications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: One-based pagination page number.
          schema:
            type: integer
            minimum: 1
            example: 1
          example: 1
      responses:
        '200':
          description: Applied job vacancies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyJobApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'


  /api/masters/positions:
    get:
      summary: List security positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/category-certificates:
    get:
      summary: List certificate categories
      description: Returns active master certificate categories ordered by title. Each item contains only the category title.
      operationId: listCertificateCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active certificate categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
              examples:
                valid:
                  summary: Certificate categories
                  value:
                    status: true
                    data:
                      - title: K3 / Keselamatan Kerja
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/abilities:
    get:
      summary: List security abilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active abilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/placements:
    get:
      summary: List security placements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active placements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/masters/industries:
    get:
      summary: List business industries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active industries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/provinces:
    get:
      summary: List provinces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provinces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/locations/cities:
    get:
      summary: List cities for a province
      security:
        - bearerAuth: []
      parameters:
        - name: province_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/districts:
    get:
      summary: List districts for a city
      security:
        - bearerAuth: []
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/locations/villages:
    get:
      summary: List villages for a district
      security:
        - bearerAuth: []
      parameters:
        - name: district_code
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Villages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/profile:
    get:
      summary: Get the complete authenticated profile
      operationId: getAuthenticatedProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Complete role-specific profile values and state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Partially update the authenticated profile
      operationId: updateAuthenticatedProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateSecurityProfileRequest'
                - $ref: '#/components/schemas/UpdateCompanyProfileRequest'
                - $ref: '#/components/schemas/UpdateBujpProfileRequest'
            examples:
              security:
                $ref: '#/components/examples/UpdateSecurityProfileRequest'
              company:
                $ref: '#/components/examples/UpdateCompanyProfileRequest'
              bujp:
                $ref: '#/components/examples/UpdateBujpProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/password:
    patch:
      summary: Change or set the authenticated user's local password
      description: |
        Changes the local password for the authenticated user. `current_password`
        is required when `has_local_password` is true and can be omitted when a
        Google-only user is setting a local password for the first time.
      operationId: changeAuthenticatedPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              existing-password:
                summary: Change an existing local password
                value:
                  current_password: OldPass1
                  password: NewPass2
                  password_confirmation: NewPass2
              google-account:
                summary: Set a local password for a Google account
                value:
                  password: NewPass2
                  password_confirmation: NewPass2
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Current password is incorrect or password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/me:
    get:
      summary: Get the authenticated mobile user
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and role-specific profile state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh-token:
    post:
      summary: Refresh mobile access tokens
      description: Exchanges a refresh token for a new access token and rotated refresh token.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/logout:
    post:
      summary: Log out the current mobile session
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing, invalid, expired, or revoked access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/register:
    post:
      summary: Register a user
      description: |
        Registers a security, company, or BUJP account using the existing
        users, user_*, and role-specific profile models.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterSecurityRequest'
                - $ref: '#/components/schemas/RegisterCompanyRequest'
                - $ref: '#/components/schemas/RegisterBujpRequest'
            examples:
              security:
                $ref: '#/components/examples/SecurityRequest'
              company:
                $ref: '#/components/examples/CompanyRequest'
              bujp:
                $ref: '#/components/examples/BujpRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                security:
                  $ref: '#/components/examples/SecurityResponse'
                company:
                  $ref: '#/components/examples/CompanyResponse'
                bujp:
                  $ref: '#/components/examples/BujpResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Registration failed because of a server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/security-certificates:
    get:
      summary: List the authenticated security user's certificates
      description: Returns only certificates belonging to the authenticated satpam user's security profile, ordered by expiration date ascending.
      operationId: listSecurityCertificates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCertificateListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/SecurityCertificateListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a security certificate
      description: Creates a certificate for the authenticated security profile. The category must be an active master_category_certificates.title. Send the request as multipart/form-data when uploading a file.
      operationId: createSecurityCertificate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
      responses:
        '201':
          description: Security certificate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCertificateResponse'
              examples:
                created:
                  $ref: '#/components/examples/SecurityCertificateCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/security-certificates/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the security certificate.
        schema:
          type: string
          format: uuid
    get:
      summary: Get a security certificate
      description: Returns a certificate only when it belongs to the authenticated security user's profile.
      operationId: getSecurityCertificate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCertificateResponse'
              examples:
                valid:
                  $ref: '#/components/examples/SecurityCertificateShowResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace fields on a security certificate
      description: Updates certificate fields for the authenticated security profile. Omitted fields retain their existing values. Send multipart/form-data when replacing the file.
      operationId: updateSecurityCertificate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
      responses:
        '200':
          description: Security certificate updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCertificateResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityCertificateUpdatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Partially update a security certificate
      description: Partially updates a certificate for the authenticated security profile. Omitted fields retain their existing values. Send multipart/form-data when replacing the file.
      operationId: partiallyUpdateSecurityCertificate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityCertificateRequest'
            examples:
              valid:
                $ref: '#/components/examples/SecurityCertificateRequest'
      responses:
        '200':
          description: Security certificate updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCertificateResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityCertificateUpdatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a security certificate
      description: Deletes a certificate only when it belongs to the authenticated security user's profile. Any stored certificate file is deleted as well.
      operationId: deleteSecurityCertificate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security certificate deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/security-histories:
    get:
      summary: List the authenticated security user's work histories
      description: Returns only histories belonging to the authenticated satpam user's security profile, ordered newest first.
      operationId: listSecurityHistories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security work histories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryListResponse'
              examples:
                valid:
                  $ref: '#/components/examples/SecurityHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a security work history
      description: Creates a work history for the authenticated security profile. Category must be an active master placement title. `end_date` may be null only when `is_current` is true.
      operationId: createSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '201':
          description: Security history created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                created:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/security-histories/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the security work history.
        schema:
          type: string
          format: uuid
    get:
      summary: Get a security work history
      description: Returns a history only when it belongs to the authenticated security user's profile.
      operationId: getSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                current:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace fields on a security work history. Omitted fields retain their existing values.
      operationId: updateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityHistoryCompletedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Partially update a security work history. Omitted fields retain their existing values.
      operationId: partiallyUpdateSecurityHistory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHistoryRequest'
            examples:
              completed:
                $ref: '#/components/examples/SecurityHistoryCompletedRequest'
              current:
                $ref: '#/components/examples/SecurityHistoryCurrentRequest'
      responses:
        '200':
          description: Security history updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHistoryResponse'
              examples:
                updated:
                  $ref: '#/components/examples/SecurityHistoryCurrentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a security work history
      operationId: deleteSecurityHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security history deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

